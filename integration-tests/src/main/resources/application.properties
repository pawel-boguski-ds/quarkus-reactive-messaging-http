quarkus.log.category."io.quarkus.reactivemessaging".min-level=TRACE
quarkus.log.category."io.quarkus.reactivemessaging".level=TRACE

mp.messaging.incoming.websocket-source.connector=quarkus-websocket
mp.messaging.incoming.websocket-source.path=/my-websocket
mp.messaging.incoming.websocket-source.deserializer=io.quarkus.reactivemessaging.http.FirstLowerCaseDeserializer

mp.messaging.outgoing.websocket-sink.connector=quarkus-websocket
mp.messaging.outgoing.websocket-sink.url=ws://localhost:${quarkus.http.test-port:8081}/my-websocket
mp.messaging.outgoing.websocket-sink.serializer=io.quarkus.reactivemessaging.http.ToUpperCaseSerializer

mp.messaging.incoming.websocket-source-with-ack.connector=quarkus-websocket
mp.messaging.incoming.websocket-source-with-ack.path=/my-websocket-with-ack
mp.messaging.incoming.websocket-source-with-ack.message-id-provider=io.quarkus.reactivemessaging.http.TestMessageIdProvider

mp.messaging.outgoing.websocket-sink-with-ack.connector=quarkus-websocket
mp.messaging.outgoing.websocket-sink-with-ack.url=ws://localhost:${quarkus.http.test-port:8081}/my-websocket-with-ack
mp.messaging.outgoing.websocket-sink-with-ack.message-id-provider=io.quarkus.reactivemessaging.http.TestMessageIdProvider

mp.messaging.incoming.websocket-source-with-ack-and-inflights.connector=quarkus-websocket
mp.messaging.incoming.websocket-source-with-ack-and-inflights.path=/my-websocket-with-ack-and-inflights
mp.messaging.incoming.websocket-source-with-ack-and-inflights.message-id-provider=io.quarkus.reactivemessaging.http.TestMessageIdProvider
mp.messaging.incoming.websocket-source-with-ack-and-inflights.buffer-size=50

mp.messaging.outgoing.websocket-sink-with-ack-and-inflights.connector=quarkus-websocket
mp.messaging.outgoing.websocket-sink-with-ack-and-inflights.url=ws://localhost:${quarkus.http.test-port:8081}/my-websocket-with-ack-and-inflights
mp.messaging.outgoing.websocket-sink-with-ack-and-inflights.message-id-provider=io.quarkus.reactivemessaging.http.TestMessageIdProvider
mp.messaging.outgoing.websocket-sink-with-ack-and-inflights.maxInflightMessages=50

mp.messaging.incoming.http-source.connector=quarkus-http
mp.messaging.incoming.http-source.path=/my-http-resource
mp.messaging.incoming.http-source.method=PUT
mp.messaging.incoming.http-source.deserializer=io.quarkus.reactivemessaging.http.FirstLowerCaseDeserializer

mp.messaging.outgoing.http-sink.connector=quarkus-http
mp.messaging.outgoing.http-sink.method=PUT
mp.messaging.outgoing.http-sink.url=http://localhost:${quarkus.http.test-port:8081}/my-http-resource
mp.messaging.outgoing.http-sink.serializer=io.quarkus.reactivemessaging.http.ToUpperCaseSerializer

mp.messaging.incoming.celistener.connector=quarkus-http
mp.messaging.incoming.celistener.path=/celistener

mp.messaging.outgoing.ceresource.connector=quarkus-http
mp.messaging.outgoing.ceresource.url=http://localhost:8282

mp.messaging.incoming.root.connector=quarkus-http
mp.messaging.incoming.root.path=/